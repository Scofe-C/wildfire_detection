[project]
name = "wildfire-model-pipeline"
version = "1.0.0"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 100

# The top-level keys are deprecated as of ruff >= 0.2.0 and will be removed.
# This also eliminates the CI warning:
#   "The top-level linter settings are deprecated in favour of their counterparts
#    in the `lint` section."

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = [
    "E501",  # line too long — handled by line-length above
    "N803",  # argument name should be lowercase — suppressed: `X` is the universal
             # ML convention for a feature matrix (pd.DataFrame). Renaming to `x`
             # throughout model, bias, and validation code would harm readability.
    "N806",  # variable in function should be lowercase — same rationale as N803.
             # Affects: X, X_syn, X_out, X_aug, X_up in ML pipeline code.
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
ignore_missing_imports = true
# Disable error codes that fire exclusively due to untyped third-party libraries
# (yaml, mlflow, google SDKs). These produce noise without catching real bugs.
# Re-enable per-module once upstream stubs are available or we add inline ignores.
disable_error_code = ["no-any-return", "import-untyped"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "src/models/*/placeholder.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.",
]