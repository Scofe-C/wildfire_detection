# OBJ-3 — Gemini Disaster Reporting Engine Configuration
# Single source of truth for all OBJ-3 runtime settings.

# Active LLM backend: "ollama" | "gemini_dev" | "vertex_ai"
# Override priority: CLI --backend > env var LLM_BACKEND > this value
llm_backend: "gemini_dev"

# --- Ollama (Phase 1: local model) ---
ollama:
  model: "qwen3:8b"
  base_url: "http://localhost:11434"
  temperature: 0.0
  max_retries: 2

# --- Gemini Developer API (Phase 2: free-tier API key) ---
# Free tier: 10 RPM, 250 RPD for 2.5-flash; preview models have lower limits
# API key read from env var GEMINI_API_KEY
gemini_dev:
  model: "gemini-3-flash-preview"
  # Auto-fallback priority: on rate limit, switch to next model in order.
  # Per-minute limit → pause 60s and retry same model (up to 2 times).
  # Per-day limit → mark model exhausted, switch to next.
  model_priority:
    - "gemini-3-flash-preview"    # Primary: newest generation, best instruction following
    - "gemini-2.5-flash"          # Fallback 1: stable, 10 RPM / 500 RPD / 250K TPM
    - "gemini-2.5-flash-lite"     # Fallback 2: lighter, 30 RPM / 1500 RPD / 250K TPM
    - "gemini-2.0-flash"          # Fallback 3: older but proven, 15 RPM / 1500 RPD / 1M TPM
    - "gemini-2.0-flash-lite"     # Last resort: lightest, 30 RPM / 1500 RPD / 1M TPM
  # NOT recommended for free tier:
  #   "gemini-2.5-pro"  — only 5 RPM / 25 RPD, exhausts instantly
  # Check latest limits: https://ai.google.dev/pricing

# --- Vertex AI (Phase 3: GCP project) ---
vertex_ai:
  model: "gemini-2.5-flash"
  project_id: "wildfire-detection-486319"
  location: "us-central1"
  corpus_cache_ttl_seconds: 3600

# --- RAG Corpus ---
corpus:
  version: "processed"
  local_dir: "corpus/"
  gcs_prefix: "corpus/"
  max_corpus_chars: 500000         # Cloud backends (Gemini, Vertex AI)
  ollama_max_corpus_chars: 20000   # Local models — stay within effective context window

# --- Reporting ---
reporting:
  confidence_threshold: 0.70
  min_grounding_sources: 3
  output_dir: "reports/disaster_reports"
  gcs_bucket: ""
  default_render_format: "auto"   # "json" (save JSON only) | "auto" (JSON + rendered HTML/MD)
  max_ml_block_chars: 20000       # Cloud backends
  max_data_block_chars: 20000     # Cloud backends
  ollama_max_ml_block_chars: 6000    # Local models — keep total context < 32K tokens
  ollama_max_data_block_chars: 6000  # Local models
  parse_max_retries: 3               # Max retries on JSON parse failure
  parse_retry_base_delay: 1.0        # Base delay (seconds) — exponential backoff: delay = base * 2^attempt

# --- Incident Tracker (EMERGENCY sub-state transitions) ---
incident_tracker:
  interim_hours: 2         # ACTIVE_FIRE → INTERIM after no hotspots for 2h
  post_fire_hours: 12      # INTERIM → POST_FIRE after no hotspots for 12h
  final_hours: 48          # POST_FIRE → FINAL after no hotspots for 48h
  gc_max_age_days: 30      # Archived incidents older than this are garbage-collected

# --- Admin Toggle (human input channel) ---
admin_toggle:
  default: true
  current_state: true
  persistence: "local"            # "local" (Phase 1) | "firestore" (Phase 3)
  firestore_collection: "config"
  firestore_document: "admin_flags"