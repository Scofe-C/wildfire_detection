paths:
  backfill_dir: ../data-pipeline/data/processed/backfill
  models_dir: models/ignition
  validation_dir: reports/validation
  bias_dir: reports/bias_gate
  visualizations_dir: reports/visualizations
  fema_nri_cache: data/static/fema_nri
validation:
  auc_pr_threshold: 0.75
  decision_threshold: 0.5
bias_gate:
  max_disparity: 0.05
shap:
  min_soil_moisture_importance: 0.1
tracking:
  mlflow:
    tracking_uri: sqlite:///mlruns.db
    experiment_name: wildfire-model-pipeline
  vertex_ai:
    project: ${GOOGLE_CLOUD_PROJECT}
    location: us-central1
    experiment_name: wildfire-model-pipeline
notifications:
  slack:
    webhook_env_var: SLACK_WEBHOOK_URL
    enabled: true
obj2:
  cell2fire:
    binary_path: /home/ibrahim/C2F-W/Cell2Fire/Cell2Fire
    raster_inputs:
      dem: /mnt/c/Users/mohdi/Downloads/wildfire_detection/model-pipeline/data/static/dem
      fuel: /mnt/c/Users/mohdi/Downloads/wildfire_detection/model-pipeline/data/static/landfire/fbfm40
      canopy_cover: /mnt/c/Users/mohdi/Downloads/wildfire_detection/model-pipeline/data/static/landfire/cc
      canopy_height: data/static/landfire/ch
    default_params:
      n_simulations: 100
      fire_period_length_hr: 1.0
      output_grid: true
      weather_duration_hr: 24
      cell_size_m: 30
    sweep_space:
      n_simulations:
      - 50
      - 100
      - 200
      - 500
      fire_period_length_hr:
      - 0.5
      - 1.0
      - 2.0
      - 4.0
      grid_resolution_m:
      - 30
      - 60
      - 90
    validation:
      perimeter_source: cal_fire_frap
      primary_metric: dice_coefficient
      minimum_dice: 0.5
    output:
      format: geojson
      crs: EPSG:4326
  propagator:
    enabled: true
    crosswalk_path: data/crosswalks/fbfm40_to_propagator.json
    disclaimer: FOR DEMONSTRATION PURPOSES ONLY — Mediterranean fuel model, not calibrated
      for US vegetation types.
    default_params:
      time_resolution_hr: 1.0
      wind_reduction_factor: 0.4
