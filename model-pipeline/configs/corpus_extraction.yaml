# =============================================================================
# Corpus Extraction Configuration
# =============================================================================
# Controls how extract_corpus.py processes the 6 reference PDFs into
# structured JSON chunks for corpus_loader.py and Vertex AI context caching.
#
# PAGE OVERRIDE GUIDE:
#   - page_override: [start, end]  → 1-indexed, inclusive
#   - page_override: null          → keyword search (avoid — causes bad extraction)
#
# DOCUMENT TYPES (used by distill_corpus.py to select prompt):
#   - form_schema        → ICS forms: extract as structured field registry
#   - tabular_reference  → Fuel model tables: verbatim numeric extraction
#   - prose_guide        → IRPG, IMSR: CoT-guided compression
#   - methodology_doc    → FEMA NRI: formula + score extraction
#
# HOW TO FIND CORRECT PAGE NUMBERS:
#   Run: python scripts/audit_corpus_pages.py --doc <doc_id> > audit_<doc_id>.txt
#   Then open the .txt file and search for your target section headings.
#   Update page_override values below and re-run:
#   python scripts/extract_corpus.py --config configs/corpus_extraction.yaml --doc <doc_id>
#
# PAGES MARKED [VERIFY]: estimated from public TOC / research. Run audit script to confirm.
# PAGES MARKED [AUDIT REQUIRED]: document structure unknown — audit script mandatory.
# =============================================================================

extraction:
  input_dir: corpus/raw
  output_dir: corpus/processed
  min_chunk_chars: 200
  max_chunk_chars: 100000   # Soft ceiling only — distillation compresses to 8000. Hard truncation removed.
  overlap_lines: 2

# =============================================================================
# Document Definitions
# =============================================================================

documents:

  # ---------------------------------------------------------------------------
  # ICS-209 — Incident Status Summary
  # WARNING: This is a fillable PDF form. pdfplumber extract_text() returns
  # only static label text, NOT form field values. Pages contain block labels
  # and instructions — this is actually what we want for the RAG corpus
  # (we want the schema definition, not a filled-out instance).
  #
  # Audit note: Run audit script and look for "Block" headers and instruction
  # text. The form is ~4 pages + instruction pages.
  # ---------------------------------------------------------------------------
  ics209:
    path: "ics/ICS 209 Fillable PDF Form.pdf"
    source_name: "ICS Form 209 — Incident Status Summary"
    source_org: "FEMA / NIMS"
    geography: shared
    chunks:
      - id: field_definitions
        doc_type: form_schema              # distill_corpus.py uses schema extraction prompt
        keywords: ["block", "instructions", "complete", "enter"]
        page_override: [1, 23]            # AUDITED: p1-4 = form, p5-23 = block-by-block instruction guide
        extract_tables: true

      - id: resource_summary
        doc_type: form_schema
        keywords: ["resources assigned", "personnel", "engines", "helicopters", "crews"]
        page_override: [4, 6]             # [VERIFY] Resource commitment summary (Page 4 of form)
        extract_tables: true

      - id: incident_status
        doc_type: form_schema
        keywords: ["percent contained", "estimated containment", "acres", "structures"]
        page_override: [1, 3]             # [VERIFY] Incident status fields on pp.1-2, instructions pp.2-3
        extract_tables: true              # FIXED: was false — ICS-209 tables are critical

  # ---------------------------------------------------------------------------
  # NIMS ICS Forms Booklet — Full completion guide (~200 pages)
  # [AUDIT REQUIRED] Run audit script to find page ranges for each ICS form.
  # The booklet contains completion guides for ICS-201 through ICS-215A.
  # Search audit output for "209", "201", "204" section headers.
  # ---------------------------------------------------------------------------
  nims_booklet:
    path: "ics/nims ics forms booklet (v3).pdf"
    source_name: "NIMS ICS Forms Booklet (v3)"
    source_org: "FEMA / NIMS"
    geography: shared
    chunks:
      - id: ics209_completion_guide
        doc_type: form_schema
        keywords: ["209", "incident status summary", "block", "completion"]
        page_override: [36, 58]           # AUDITED: p36-39 = ICS 209 form, p40-58 = block-by-block instructions (doc is 115pp, not ~200)
        extract_tables: true

      - id: ics201_briefing_guide
        doc_type: form_schema
        keywords: ["201", "incident briefing", "map", "sketch", "objectives"]
        page_override: [5, 12]            # AUDITED: p5 = forms index, p6-9 = ICS 201 form, p10-11 = instructions
        extract_tables: false

      - id: ics204_assignment_guide
        doc_type: form_schema
        keywords: ["204", "assignment list", "branch", "division", "work assignment"]
        page_override: [18, 21]           # AUDITED: p18 = ICS 204 form, p19-20 = assignment instructions
        extract_tables: true

  # ---------------------------------------------------------------------------
  # NWCG IRPG — Incident Response Pocket Guide, PMS 461 (2025)
  #
  # IMPORTANT: Content page numbers in the TOC ≠ physical PDF page numbers.
  # The PDF has ~14 pages of front matter (cover, introduction, TOC) before
  # content page 1. Physical page = content page + ~14.
  #
  # Verified TOC (from public PDF at nwcg.gov):
  #   Content p.1  = Risk Management Process
  #   Content p.5  = LCES
  #   Content p.6  = Safety Zones
  #   Content p.7  = Downhill Fireline Checklist
  #   Content p.8  = Indicators of Incident Complexity
  #   Content p.11 = WUI Firefighting
  #   Content p.17 = Specific Hazards (gray pages)
  #   Content p.33 = Fire Environment (orange pages)
  #   Content p.44 = Fine Fuel Moisture (FFM) and Probability of Ignition
  #   Content p.49 = Fine Fuel Moisture and Fire Behavior
  #   Content p.61 = Aviation (blue pages)
  #   Content p.83 = Other References (white pages): engine typing, water tender
  #   Content p.86 = Chainsaw Operations
  #   Content p.87 = Working with Heavy Equipment
  #   Content p.89 = Engine Typing Standards
  #   Content p.107= Emergency Medical Care (red pages)
  #
  # Page offsets below are ESTIMATES. Run audit script to confirm exact values:
  #   python scripts/audit_corpus_pages.py --doc irpg > audit_irpg.txt
  #   Then search for "Risk Management", "LCES", "Complexity", etc.
  # ---------------------------------------------------------------------------
  irpg:
    path: nwcg/pms461.pdf
    source_name: "Incident Response Pocket Guide, PMS 461 (2025)"
    source_org: "NWCG"
    geography: shared
    chunks:
      - id: incident_complexity
        doc_type: prose_guide
        keywords: ["complexity", "type 1", "type 2", "type 3", "type 4", "type 5"]
        page_override: [24, 26]           # AUDITED: p24 = "Indicators of Incident Complexity" (exact start)
        extract_tables: true

      - id: resource_typing
        doc_type: prose_guide
        keywords: ["resource", "typing", "engine", "crew", "helicopter", "dozer"]
        page_override: [99, 120]          # AUDITED: p99 = "OTHER REFERENCES" start (engine typing, chainsaw, equipment)
        extract_tables: true

      - id: risk_management
        doc_type: prose_guide
        keywords: ["lces", "watch out", "risk management", "hazard", "safety zone"]
        page_override: [15, 48]           # AUDITED: p15 = stress/AAR, p17 = Risk Mgmt Process, p33 = Specific Hazards, p48 = end
        extract_tables: false

      - id: wui_considerations
        doc_type: prose_guide
        keywords: ["wildland urban interface", "wui", "structure", "triage", "defensible"]
        page_override: [27, 32]           # AUDITED: p27 = "Wildland Urban Interface (WUI) Firefighting" (exact start)
        extract_tables: false

  # ---------------------------------------------------------------------------
  # NIFC — Understanding the IMSR 2024
  # CONFIRMED: This PDF is only 4 pages total (verified by audit).
  # No California or Texas sections exist — it is a national overview document.
  # Original ca_geographic_area / tx_geographic_area chunks REMOVED (returned
  # 0 chars — keywords do not appear in a 4-page national summary).
  # All content (IMSR structure, preparedness levels PL1-5, suppression
  # strategies: Full/Confine/Point/Monitoring) is in a single chunk.
  # ---------------------------------------------------------------------------
  imsr_guide:
    path: "nifc/Understanding the IMSR 2024.pdf"
    source_name: "Understanding the Incident Management Situation Report (2024)"
    source_org: "NIFC"
    geography: shared
    chunks:
      - id: full_guide
        doc_type: prose_guide
        keywords: ["imsr", "preparedness level", "suppression", "incident"]
        page_override: [1, 4]             # Confirmed: entire document is 4 pages
        extract_tables: true

  # ---------------------------------------------------------------------------
  # FEMA NRI — National Risk Index Technical Documentation
  #
  # ARCHITECTURE DECISION: Per-county risk score tables (CA/TX) are NOT in
  # the RAG corpus. Reasons:
  #   1. Raw county tables are 600K–730K chars — datasets, not reference docs
  #   2. Per-county lookups are better served by direct FEMA NRI API at runtime
  #   3. What Gemini needs for grounding is the METHODOLOGY (what scores mean,
  #      how they are calculated) not raw data rows
  #
  # Three focused chunks covering what the LLM actually needs:
  #   1. risk_scoring_methodology — EAL formula, rating thresholds, score tiers
  #   2. wildfire_risk_overview   — wildfire-specific methodology + FSim source
  #   3. vulnerability_indicators — SVI/BRIC definitions for vulnerable_populations
  #
  # [AUDIT REQUIRED] for all 3 — run:
  #   python scripts/audit_corpus_pages.py --doc fema_nri > audit_fema.txt
  # Search for: "Expected Annual Loss", "Wildfire", "Social Vulnerability"
  # These are methodology sections, typically 2-5 pages each near the front.
  # ---------------------------------------------------------------------------
  fema_nri:
    path: fema/fema_national-risk-index_technical-documentation.pdf
    source_name: "FEMA National Risk Index — Technical Documentation"
    source_org: "FEMA"
    geography: shared
    chunks:
      - id: risk_scoring_methodology
        doc_type: methodology_doc
        keywords: ["expected annual loss", "social vulnerability", "composite score",
                   "risk index", "methodology", "formula"]
        page_override: [28, 50]           # AUDITED: p1-27 = front matter; p28 = Intro, p36 = Risk Overview, p43 = Risk Components, p49 = EAL
        extract_tables: true

      - id: wildfire_risk_overview
        doc_type: methodology_doc
        # Replaces wildfire_hazard_type + ca_risk_scores + tx_risk_scores
        # Contains: burn probability methodology, FSim data source, rating
        # definitions (Very High/High/Medium/Low/Very Low), EAL calculation
        # for wildfire consequence types (buildings, population, agriculture).
        # Does NOT contain per-county rows — those are excluded by page_override.
        keywords: ["wildfire", "burn probability", "fsim", "flame length",
                   "historic loss ratio", "exposure"]
        page_override: [374, 393]         # AUDITED: p374 = "22. Wildfire" + FSim/burn probability, p393 = last page before Section 23
        extract_tables: true

      - id: vulnerability_indicators
        doc_type: methodology_doc
        keywords: ["vulnerable population", "social vulnerability", "community resilience",
                   "cdc svi", "disability", "elderly"]
        page_override: [43, 50]           # AUDITED: p43 = "4. Risk Components", p44 = Social Vulnerability (4.1), p45 = Community Resilience (4.2)
        extract_tables: false

  # ---------------------------------------------------------------------------
  # Scott & Burgan — Standard Fire Behavior Fuel Models (GTR RMRS-153, 72 pp)
  #
  # CRITICAL: Fuel models are organized by TYPE (GR/GS/SH/TU/TL/SB/NB),
  # NOT by geography. There is no "California section" or "Texas section".
  # CA/TX fuel type chunks MUST use the full fuel model page range [3, 69].
  # The distillation prompt will filter for geographically relevant models.
  #
  # Verified TOC (from public USFS PDF):
  #   p.1-3  = Introduction
  #   p.4-7  = Characteristics (naming, dynamic models)
  #   p.8-11 = Fuel Model Selection Guide
  #   p.12-16= Fuel Model Crosswalks (old→new model mapping)
  #   p.17-69= Fuel Models (all 40 standard models, 2 pages each)
  #             NB (nonburnable): p.19-20
  #             GR (grass): p.21-30
  #             GS (grass-shrub): p.31-36
  #             SH (shrub — includes chaparral/manzanita): p.37-46
  #             TU (timber understory): p.47-56
  #             TL (timber litter): p.57-64
  #             SB (slash-blowdown): p.65-69
  #   p.70-72= References (SKIP — contains no fuel model data)
  #
  # Page offsets: minimal front matter (~2 pages), so content ≈ physical page.
  # [VERIFY] with: python scripts/audit_corpus_pages.py --doc scott_burgan
  # ---------------------------------------------------------------------------
  scott_burgan:
    path: usfs/rmrs_gtr153.pdf
    source_name: "Standard Fire Behavior Fuel Models (Scott & Burgan 2005, GTR RMRS-153)"
    source_org: "USDA Forest Service"
    geography: shared
    chunks:
      - id: fuel_model_table
        doc_type: tabular_reference       # verbatim numeric extraction — NO paraphrasing
        keywords: ["fuel model", "fbfm", "gr", "gs", "sh", "tu", "tl", "nb", "sb"]
        page_override: [5, 76]            # AUDITED: p3=acknowledgments, p4/6=images; p5=TOC through p76=SB4 (last fuel model)
        extract_tables: true

      - id: fire_behavior_characteristics
        doc_type: prose_guide
        keywords: ["spread rate", "flame length", "crown fire", "spotting", "rate of spread",
                   "fireline intensity"]
        page_override: [7, 22]            # AUDITED: p3=acknowledgments, p4/6=images; p7=Introduction through p22=fuel type selection guide
        extract_tables: true

      - id: fuel_moisture_reference
        doc_type: tabular_reference
        keywords: ["fuel moisture", "dead fuel", "live fuel", "1-hour", "10-hour", "100-hour"]
        page_override: [13, 22]           # AUDITED: p6=image (no text); p13="Table 2: Level of curing" + moisture scenarios through p22
        extract_tables: true

      - id: ca_fuel_types
        doc_type: tabular_reference
        keywords: ["california", "chaparral", "coastal", "shrub", "manzanita"]
        page_override: [46, 71]           # AUDITED: p37-45=GR/GS grass models (TX-relevant); p46=SH shrub start (chaparral/manzanita=CA-relevant)
        output_geography: california
        extract_tables: true              # FIXED: was false

      - id: tx_fuel_types
        doc_type: tabular_reference
        keywords: ["texas", "grassland", "savanna", "plains", "mesquite"]
        page_override: [31, 45]           # AUDITED: p21-30=timber crosswalk+NB models; p31=GR grass start through p45=GS4 (TX grassland/savanna)
        output_geography: texas
        extract_tables: true
