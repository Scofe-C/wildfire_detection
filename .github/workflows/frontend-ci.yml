# =============================================================================
# PyroWatch Frontend CI
# =============================================================================
# Validates the React + Vite frontend builds cleanly on every PR/push.
# No secrets needed — purely a build check.
#
# What it does:
#   1. Install npm dependencies
#   2. Run vite build (catches import errors, missing modules, type issues)
#
# Triggers on any change to Frontend/ source or this workflow file.
# =============================================================================

name: Frontend CI/CD

on:
  push:
    branches: [master, main, develop]
    paths:
      - 'Frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [master, main, develop]
    paths:
      - 'Frontend/**'
      - '.github/workflows/frontend-ci.yml'
  workflow_dispatch:

env:
  GCP_REGION: "us-central1"
  GCP_PROJECT: "wildfire-mlops-123"
  IMAGE: "gcr.io/wildfire-mlops-123/wildfire-frontend:latest"
  SERVICE: "wildfire-frontend"

jobs:
  build:
    name: "Build — React + Vite"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        working-directory: Frontend
        run: npm install --legacy-peer-deps

      - name: Build
        working-directory: Frontend
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: frontend-dist-${{ github.sha }}
          path: Frontend/dist/
          retention-days: 3

  deploy:
    name: "Deploy to Cloud Run"
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && vars.ENABLE_GCP_DEPLOY == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Build & push image via Cloud Build
        run: |
          gcloud builds submit \
            --tag ${{ env.IMAGE }} \
            --project ${{ env.GCP_PROJECT }} \
            Frontend

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --image ${{ env.IMAGE }} \
            --region ${{ env.GCP_REGION }} \
            --port 3000 \
            --platform managed \
            --allow-unauthenticated \
            --memory 256Mi \
            --cpu 1 \
            --project ${{ env.GCP_PROJECT }} \
            --quiet

      - name: Smoke test
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE }} \
            --region ${{ env.GCP_REGION }} --format 'value(status.url)')
          echo "Smoke test: ${URL}/"
          for i in 1 2 3; do
            HTTP=$(curl -sf -o /dev/null -w "%{http_code}" --max-time 15 "${URL}/") && break || sleep 5
          done
          [ "$HTTP" = "200" ] || { echo "Frontend /  returned ${HTTP}"; exit 1; }
          echo "Frontend serving OK"

      - name: Slack notify
        if: always()
        run: |
          STATUS="${{ job.status }}"
          COLOR="good"; [ "$STATUS" != "success" ] && COLOR="danger"
          curl -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"Frontend deploy ${STATUS} (SHA: ${{ github.sha }})\"}" \
            ${{ secrets.SLACK_WEBHOOK_URL }} || true
