# =============================================================================
# PyroWatch Frontend CI
# =============================================================================
# Validates the React + Vite frontend builds cleanly on every PR/push.
# No secrets needed — purely a build check.
#
# What it does:
#   1. Install npm dependencies
#   2. Run vite build (catches import errors, missing modules, type issues)
#
# Triggers on any change to Frontend/ source or this workflow file.
# =============================================================================

name: Frontend CI

on:
  push:
    branches: [master, main, develop]
    paths:
      - 'Frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [master, main, develop]
    paths:
      - 'Frontend/**'
      - '.github/workflows/frontend-ci.yml'
  workflow_dispatch:

jobs:
  build:
    name: "Build — React + Vite"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        working-directory: Frontend
        run: npm install --legacy-peer-deps

      - name: Build
        working-directory: Frontend
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: frontend-dist-${{ github.sha }}
          path: Frontend/dist/
          retention-days: 3
