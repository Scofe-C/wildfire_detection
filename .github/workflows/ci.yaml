# =============================================================================
# Wildfire MLOps Pipeline — CI/CD
# =============================================================================
# Repo layout:
#   wildfire_detection/              ← git repo root
#   ├── .github/workflows/ci.yaml   ← THIS FILE
#   └── Data-Pipeline/               ← project root (all source lives here)
#       ├── dags/
#       ├── scripts/
#       ├── tests/
#       ├── configs/
#       ├── docker/Dockerfile
#       ├── docker-compose.yaml
#       ├── dvc.yaml
#       ├── dvc.lock
#       ├── requirements.txt
#       └── constraints.txt
#
# Steps:
#   1. Build Docker test image (cached across runs)
#   2. Validate both DAG imports (parse-time import check)
#   3. Validate dvc.yaml syntax and dep file references
#   4. Run full pytest suite with coverage
#   5. Upload test artifacts (pytest XML + coverage XML)
#   6. Lint with ruff (E and F rules)
#   7. Check dependency consistency (critical packages pinned)
# =============================================================================

name: Pipeline CI

on:
  workflow_dispatch:
  push:
    branches: [main, develop, master, dev_ack]
    paths:
      # Data-Pipeline source
      - 'Data-Pipeline/dags/**'
      - 'Data-Pipeline/scripts/**'
      - 'Data-Pipeline/tests/**'
      - 'Data-Pipeline/configs/**'
      - 'Data-Pipeline/docker/**'
      - 'Data-Pipeline/cloud/**'
      - 'Data-Pipeline/requirements.txt'
      - 'Data-Pipeline/constraints.txt'
      - 'Data-Pipeline/dvc.yaml'
      - 'Data-Pipeline/dvc.lock'
      - 'Data-Pipeline/docker-compose.yaml'
      # Root-level infrastructure files
      - 'Makefile'
      - 'start.sh'
      - 'scripts/**'
      - '.github/workflows/ci.yaml'
  pull_request:
    branches: [main, develop, master]
    paths:
      - 'Data-Pipeline/dags/**'
      - 'Data-Pipeline/scripts/**'
      - 'Data-Pipeline/tests/**'
      - 'Data-Pipeline/configs/**'
      - 'Data-Pipeline/docker/**'
      - 'Data-Pipeline/cloud/**'
      - 'Data-Pipeline/requirements.txt'
      - 'Data-Pipeline/constraints.txt'
      - 'Data-Pipeline/dvc.yaml'
      - 'Data-Pipeline/dvc.lock'
      - 'Data-Pipeline/docker-compose.yaml'
      - 'Makefile'
      - 'start.sh'
      - 'scripts/**'
      - '.github/workflows/ci.yaml'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build only the 'test' target — no CMD, inherits all deps from airflow-base.
      # context is repo root so Dockerfile COPY paths (Data-Pipeline/..., model-pipeline/...)
      # resolve correctly. Cache layers across runs to keep build under 2 minutes.
      - name: Build CI test image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Data-Pipeline/docker/Dockerfile
          target: test
          push: false
          load: true
          tags: wildfire-pipeline:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Validates wildfire_dag.py has no import-time errors.
      # SequentialExecutor + SQLite is the correct combination for import-only checks:
      # LocalExecutor is not supported with SQLite in Airflow 2.x.
      # UNIT_TEST_MODE=true prevents Airflow from connecting to a real metadata DB.
      - name: Validate wildfire_dag imports
        run: |
          docker run --rm \
            -e AIRFLOW__CORE__LOAD_EXAMPLES=false \
            -e AIRFLOW__CORE__UNIT_TEST_MODE=true \
            -e AIRFLOW__CORE__EXECUTOR=SequentialExecutor \
            -e AIRFLOW__DATABASE__SQL_ALCHEMY_CONN="sqlite:////tmp/airflow_test.db" \
            wildfire-pipeline:test \
            python3 dags/wildfire_dag.py

      # Validate dvc.yaml syntax and that every script dep file exists on disk.
      # Runs on the host runner — no Docker needed for a pure YAML/path check.
      # data/ and models/ paths are DVC-tracked, absent from the checkout, and skipped.
      - name: Validate dvc.yaml
        working-directory: Data-Pipeline
        run: |
          python3 -m pip install --quiet pyyaml
          python3 - <<'PY'
          import yaml, os, sys

          with open('dvc.yaml') as f:
              dag = yaml.safe_load(f)

          stages = dag.get('stages', {})
          if not stages:
              print('ERROR: dvc.yaml has no stages', file=sys.stderr)
              sys.exit(1)

          missing = []
          for stage_name, stage in stages.items():
              for dep in stage.get('deps', []):
                  if dep.startswith('data/') or dep.startswith('models/'):
                      continue
                  if not os.path.exists(dep):
                      missing.append(f'{stage_name}: {dep}')

          if missing:
              print('ERROR: dep files referenced in dvc.yaml are missing:', file=sys.stderr)
              for m in missing:
                  print(f'  {m}', file=sys.stderr)
              sys.exit(1)

          print(f'dvc.yaml OK — {len(stages)} stages, all dep files present')
          PY

      # Run tests in a named container so artifacts can be copied out after exit.
      # `if: always()` on the copy step ensures artifacts are captured even on failure.
      # Tests run without GCS or real API keys — all external I/O is mocked.
      - name: Run pytest suite
        run: |
          docker run --name ci-test-run \
            -e GCS_BUCKET_NAME=test-bucket \
            -e FIRMS_MAP_KEY=test-key \
            wildfire-pipeline:test \
            pytest tests/ -v --tb=short --no-header \
              -m "not gcp and not integration and not slow" \
              --junitxml=/tmp/pytest-results.xml \
              --cov=scripts \
              --cov-report=xml:/tmp/coverage.xml \
              --cov-report=term-missing \
              --cov-fail-under=40

      - name: Extract test artifacts from container
        if: always()
        run: |
          docker cp ci-test-run:/tmp/pytest-results.xml ./pytest-results.xml 2>/dev/null || true
          docker cp ci-test-run:/tmp/coverage.xml ./coverage.xml 2>/dev/null || true
          docker rm ci-test-run || true

      - name: Upload pytest results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-results
          path: pytest-results.xml
          retention-days: 14

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14

      - name: Type check with mypy
        run: |
          docker run --rm \
            wildfire-pipeline:test \
            bash -c "pip install --quiet mypy types-PyYAML types-requests && \
              mypy scripts/ --ignore-missing-imports --no-error-summary || true"

      - name: Vulnerability scan with pip-audit
        run: |
          docker run --rm \
            wildfire-pipeline:test \
            bash -c "pip install --quiet pip-audit && pip-audit --strict 2>&1 || true"

      # Verify critical packages are pinned in constraints.txt.
      # These four packages have cross-machine compatibility requirements:
      #   pyarrow       — Parquet encoding changed between major versions
      #   great-expectations — API changed completely at v1.0
      #   dvc           — protocol changes break dvc.lock compatibility
      #   ruff          — lint rules change between versions
      - name: Check dependency consistency
        run: |
          docker run --rm \
            wildfire-pipeline:test \
            python3 -c "
          import sys, re

          req_lines = [
              l.strip() for l in open('requirements.txt')
              if l.strip() and not l.startswith('#')
          ]
          con_lines = [
              l.strip() for l in open('constraints.txt')
              if l.strip() and not l.startswith('#')
          ]

          def pkg_name(line):
              return re.split(r'[=><\[!]', line)[0].strip().lower().replace('-', '_')

          con_pkgs = {pkg_name(l) for l in con_lines}

          must_pin = [
              'pyarrow',
              'dvc',
              'ruff',
          ]

          failures = [pkg for pkg in must_pin if pkg not in con_pkgs]

          if failures:
              for pkg in failures:
                  print(f'ERROR: {pkg} must be pinned in constraints.txt', file=sys.stderr)
              sys.exit(1)

          print(f'Dependency check passed. Verified pins: {must_pin}')
          "

  # ── Deploy — upload fresh source to GCS and trigger GCE VM startup rerun ──
  # The wildfire-test-vm instance's startup script fetches
  #   gs://wildfire-mlops-123/deploy/wildfire-pipeline.tar.gz
  # on boot and runs `docker compose up -d --build`. Resetting the VM
  # (or starting it from TERMINATED) re-runs the startup script → pulls
  # new source → rebuilds + restarts Airflow containers in one step.
  deploy-airflow:
    name: "Deploy Airflow to GCE"
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && vars.ENABLE_GCP_DEPLOY == 'true'
    env:
      GCP_PROJECT: "wildfire-mlops-123"
      GCP_REGION: "us-central1"
      GCP_ZONE: "us-central1-a"
      VM_NAME: "wildfire-test-vm"
      # Matches paths the VM's instance metadata sets (gcs-bucket + gcs-staging-prefix)
      # and what Data-Pipeline/cloud/gce_startup.sh line 97 fetches on boot.
      DEPLOY_BUCKET: "wildfire-mlops-123"
      DEPLOY_PREFIX: "gce-test"
      DEPLOY_OBJECT: "gce-test/pipeline.tar.gz"

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # Tar the Data-Pipeline subtree + any root-level infra files that
      # gce_startup.sh expects. Matches what deploy_gce_test.sh produces.
      # gce_startup.sh expects a tarball whose contents extract directly into
      # /opt/wildfire (so Data-Pipeline/, model-pipeline/, Frontend/, root files).
      # Mirror what deploy_gce_test.sh does: tar the repo root, excluding junk.
      - name: Package source tarball
        run: |
          tar -czf /tmp/pipeline.tar.gz \
            --exclude='.git' --exclude='node_modules' --exclude='__pycache__' \
            --exclude='.venv' --exclude='*.log' --exclude='dist' --exclude='build' \
            Data-Pipeline model-pipeline Frontend docker-compose.yaml start.sh 2>/dev/null || \
          tar -czf /tmp/pipeline.tar.gz \
            --exclude='.git' --exclude='node_modules' --exclude='__pycache__' \
            --exclude='.venv' --exclude='*.log' \
            Data-Pipeline model-pipeline Frontend
          ls -lh /tmp/pipeline.tar.gz

      - name: Upload tarball + .env to GCS (paths gce_startup.sh reads on boot)
        run: |
          gsutil cp /tmp/pipeline.tar.gz \
            gs://${{ env.DEPLOY_BUCKET }}/${{ env.DEPLOY_OBJECT }}
          # If an .env template exists in the repo, mirror it too — gce_startup.sh
          # also fetches .env from the same prefix.
          if [ -f Data-Pipeline/.env.example ]; then
            gsutil cp Data-Pipeline/.env.example \
              gs://${{ env.DEPLOY_BUCKET }}/${{ env.DEPLOY_PREFIX }}/.env.example
          fi

      # The VM's startup script fires every time the instance boots.
      # If stopped → start (runs startup). If running → reset (reboot + rerun).
      - name: Restart GCE VM to pick up new source
        run: |
          STATE=$(gcloud compute instances describe ${{ env.VM_NAME }} \
            --zone=${{ env.GCP_ZONE }} --project=${{ env.GCP_PROJECT }} \
            --format='value(status)')
          echo "Current VM state: $STATE"
          if [ "$STATE" = "TERMINATED" ]; then
            gcloud compute instances start ${{ env.VM_NAME }} \
              --zone=${{ env.GCP_ZONE }} --project=${{ env.GCP_PROJECT }}
          else
            gcloud compute instances reset ${{ env.VM_NAME }} \
              --zone=${{ env.GCP_ZONE }} --project=${{ env.GCP_PROJECT }}
          fi

      - name: Wait for Airflow webserver health
        run: |
          EXTERNAL_IP=$(gcloud compute instances describe ${{ env.VM_NAME }} \
            --zone=${{ env.GCP_ZONE }} --project=${{ env.GCP_PROJECT }} \
            --format='value(networkInterfaces[0].accessConfigs[0].natIP)')
          echo "Waiting for http://${EXTERNAL_IP}:8080/health ..."
          for i in $(seq 1 40); do
            HTTP=$(curl -sf -o /dev/null -w "%{http_code}" --max-time 5 \
              "http://${EXTERNAL_IP}:8080/health" || echo "000")
            [ "$HTTP" = "200" ] && { echo "Airflow healthy after ${i} attempts"; exit 0; }
            sleep 15
          done
          echo "Airflow did not become healthy within ~10 min"
          exit 1

      - name: Slack notify
        if: always()
        run: |
          STATUS="${{ job.status }}"
          curl -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"Airflow (GCE VM) deploy ${STATUS} (SHA: ${{ github.sha }})\"}" \
            ${{ secrets.SLACK_WEBHOOK_URL }} || true