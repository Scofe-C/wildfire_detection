name: Model Pipeline CI/CD

on:
  push:
    branches: [main, master]
    paths: ["model-pipeline/**"]
  pull_request:
    branches: [main, master]
    paths: ["model-pipeline/**"]

env:
  PYTHON_VERSION: "3.11"

# ──────────────────────────────────────────────────────────────────────
# DESIGN NOTES
#
# 1. CI runs UNIT TESTS ONLY. Integration tests (Ollama, Gemini) run
#    locally. This keeps CI fast, free of GPU/API-key dependencies,
#    and focused on catching regressions from other contributors.
#
# 2. Stages 5–9 use a "detect-implementation" pattern: a preliminary
#    step checks whether the relevant code exists and is non-trivial.
#    If not implemented yet, the stage passes with a visible skip
#    reason — no silent `|| echo` hacks that swallow real failures.
#
# 3. Dependency caching cuts ~30–60s per job.
# ──────────────────────────────────────────────────────────────────────

jobs:
  # ── Stage 1 ─────────────────────────────────────────────────────────
  lint:
    name: "Stage 1 — Lint & Type Check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: model-pipeline/requirements.txt
      - name: Install linters
        working-directory: model-pipeline
        run: pip install ruff mypy
      - name: Ruff lint
        working-directory: model-pipeline
        run: ruff check src/ tests/
      - name: Mypy type check
        working-directory: model-pipeline
        run: mypy src/ --ignore-missing-imports --no-strict-optional

  # ── Stage 2 ─────────────────────────────────────────────────────────
  test:
    name: "Stage 2 — Unit Tests"
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: model-pipeline/requirements.txt
      - name: Install dependencies
        working-directory: model-pipeline
        run: pip install -r requirements.txt
      - name: Run unit tests with coverage
        working-directory: model-pipeline
        run: |
          pytest tests/ -v \
            --ignore=tests/obj3/integration \
            --ignore=tests/integration \
            -m "not integration" \
            --cov=src \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=80

  # ── Stage 3 ─────────────────────────────────────────────────────────
  build:
    name: "Stage 3 — Container Build"
    runs-on: ubuntu-latest
    needs: test
    # Only build on push to main — not on PRs, not on feature branches
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build multi-platform image
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -t wildfire-model:${{ github.sha }} \
            ./model-pipeline

  # ── Stage 4 ─────────────────────────────────────────────────────────
  integration:
    name: "Stage 4 — Integration Test (CI-safe subset)"
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: model-pipeline/requirements.txt
      - name: Install dependencies
        working-directory: model-pipeline
        run: pip install -r requirements.txt
      - name: Check for CI-safe integration tests
        id: check_integration
        working-directory: model-pipeline
        run: |
          # Count tests marked 'integration' that do NOT require Ollama/Gemini
          # For now, all integration tests require external services → skip in CI
          count=$(find tests/ -name "test_*.py" -path "*/integration/*" | wc -l)
          if [ "$count" -gt 0 ]; then
            echo "status=found" >> "$GITHUB_OUTPUT"
            echo "Found $count integration test files — but all require external services (Ollama/Gemini)"
            echo "Integration tests run locally, not in CI"
          else
            echo "status=none" >> "$GITHUB_OUTPUT"
          fi
      - name: Skip reason
        run: echo "::notice::Integration tests require Ollama/Gemini — run locally with 'pytest tests/obj3/integration/ -v -s'"

  # ── Stage 5 ─────────────────────────────────────────────────────────
  validate:
    name: "Stage 5 — Model Validation (AUC-PR > 0.75)"
    runs-on: ubuntu-latest
    needs: integration
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: model-pipeline/requirements.txt
      - name: Detect implementation
        id: detect
        working-directory: model-pipeline
        run: |
          # Stage 5 requires: a trained model artifact OR a validation script
          # that loads the model and computes AUC-PR.
          # Check for the orchestrator's validation hook.
          if grep -rq "def validate_model\|def run_validation\|auc_pr" src/models/obj1_* 2>/dev/null; then
            echo "implemented=true" >> "$GITHUB_OUTPUT"
          else
            echo "implemented=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Stage 5 skipped — OBJ-1 model validation not yet implemented"
          fi
      - name: Install dependencies
        if: steps.detect.outputs.implemented == 'true'
        working-directory: model-pipeline
        run: pip install -r requirements.txt
      - name: Validate model metrics
        if: steps.detect.outputs.implemented == 'true'
        working-directory: model-pipeline
        run: |
          python -c "
          from src.pipeline.orchestrator import PipelineOrchestrator
          orch = PipelineOrchestrator()
          result = orch.run_validation()
          assert result.metrics['auc_pr'] > 0.75, f'AUC-PR {result.metrics[\"auc_pr\"]} < 0.75 threshold'
          print(f'Model validation passed: AUC-PR = {result.metrics[\"auc_pr\"]:.4f}')
          "

  # ── Stage 6 ─────────────────────────────────────────────────────────
  bias_gate:
    name: "Stage 6 — Bias Gate (BLOCKING)"
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: model-pipeline/requirements.txt
      - name: Detect implementation
        id: detect
        working-directory: model-pipeline
        run: |
          # Stage 6 requires: bias gate module with FEMA NRI integration
          if grep -rq "def run_bias_gate\|class BiasGate\|bias_gate" src/models/obj1_* src/pipeline/ 2>/dev/null; then
            echo "implemented=true" >> "$GITHUB_OUTPUT"
          else
            echo "implemented=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Stage 6 skipped — Bias gate not yet implemented (needs OBJ-1 predictions + FEMA NRI data)"
          fi
      - name: Install dependencies
        if: steps.detect.outputs.implemented == 'true'
        working-directory: model-pipeline
        run: pip install -r requirements.txt
      - name: Run bias gate checks
        if: steps.detect.outputs.implemented == 'true'
        working-directory: model-pipeline
        run: |
          python -c "
          from src.pipeline.orchestrator import PipelineOrchestrator
          orch = PipelineOrchestrator()
          result = orch.run_bias_gate()
          assert result.bias_report['gate_result'] == 'PASS', f'Bias gate FAILED: {result.bias_report}'
          print(f'Bias gate passed: disparity = {result.bias_report[\"observed_disparity\"]:.4f}')
          "

  # ── Stage 7 ─────────────────────────────────────────────────────────
  push_artifact:
    name: "Stage 7 — Artifact Push"
    runs-on: ubuntu-latest
    needs: bias_gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Detect implementation
        id: detect
        working-directory: model-pipeline
        run: |
          # Stage 7 requires: artifact push script or GCS upload logic
          if [ -f "scripts/push_artifact.py" ] || grep -rq "def push_artifact\|def upload_model" src/pipeline/ 2>/dev/null; then
            echo "implemented=true" >> "$GITHUB_OUTPUT"
          else
            echo "implemented=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Stage 7 skipped — Artifact push not yet implemented"
          fi
      - name: Push artifact
        if: steps.detect.outputs.implemented == 'true'
        working-directory: model-pipeline
        run: python scripts/push_artifact.py

  # ── Stage 8 ─────────────────────────────────────────────────────────
  vertex_sync:
    name: "Stage 8 — Vertex AI Sync (non-blocking)"
    runs-on: ubuntu-latest
    needs: push_artifact
    if: always() && needs.push_artifact.result == 'success'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Detect implementation
        id: detect
        working-directory: model-pipeline
        run: |
          if [ -f "scripts/vertex_sync.py" ] || grep -rq "def sync_to_vertex\|vertex_ai" src/pipeline/ 2>/dev/null; then
            echo "implemented=true" >> "$GITHUB_OUTPUT"
          else
            echo "implemented=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Stage 8 skipped — Vertex AI sync not yet implemented"
          fi
      - name: Sync to Vertex AI
        if: steps.detect.outputs.implemented == 'true'
        working-directory: model-pipeline
        run: python scripts/vertex_sync.py

  # ── Stage 9 ─────────────────────────────────────────────────────────
  deploy:
    name: "Stage 9 — Deploy"
    runs-on: ubuntu-latest
    needs: push_artifact
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Detect implementation
        id: detect
        working-directory: model-pipeline
        run: |
          if [ -f "scripts/deploy.py" ] || [ -f "deploy/cloudrun.yaml" ] || [ -f "deploy/terraform.tf" ]; then
            echo "implemented=true" >> "$GITHUB_OUTPUT"
          else
            echo "implemented=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Stage 9 skipped — Deployment not yet configured"
          fi
      - name: Deploy
        if: steps.detect.outputs.implemented == 'true'
        working-directory: model-pipeline
        run: python scripts/deploy.py

  # ── Failure notification ────────────────────────────────────────────
  notify_failure:
    name: "Notify on Failure"
    runs-on: ubuntu-latest
    needs: [lint, test, build, integration, validate, bias_gate]
    if: failure()
    steps:
      - name: Slack failure notification
        run: |
          curl -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{"text":":x: *Model Pipeline FAILED* — ${{ github.ref }} @ `${{ github.sha }}`\nJob: `${{ github.job }}`\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}' \
            || true