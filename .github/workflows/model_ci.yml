name: Model Pipeline CI/CD

on:
  push:
    branches: [master, main, develop]
    paths:
      - "model-pipeline/**"
      - ".github/workflows/model_ci.yml"
  pull_request:
    branches: [master, main, develop]
    paths:
      - "model-pipeline/**"
      - ".github/workflows/model_ci.yml"
  workflow_dispatch:
    inputs:
      triggered_by:
        description: "Trigger source (manual/drift_detection/operator_rerun)"
        default: "manual"

env:
  PYTHON_VERSION: "3.11"
  GCS_BUCKET: "wildfire-mlops-123"
  GCP_REGION: "us-central1"

# Cancel in-progress runs on the same branch to avoid conflicting deploys
concurrency:
  group: model-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Stage 1: Unit tests ──────────────────────────────────────────────────
  unit-tests:
    name: "Stage 1 — Unit Tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        working-directory: model-pipeline
        run: pip install -r requirements.txt

      - name: Install pytest-cov
        run: pip install pytest-cov

      - name: Run unit tests (OBJ-1 only, skip OBJ-2/3)
        working-directory: model-pipeline
        run: |
          pytest tests/ \
            --ignore=tests/obj2 \
            --ignore=tests/obj3 \
            -v --tb=short \
            --cov=src \
            --cov-report=term-missing \
            --cov-fail-under=35

  # ── Stage 3: Container build ─────────────────────────────────────────────
  container-build:
    name: "Stage 3 — Container Build"
    runs-on: ubuntu-latest
    needs: unit-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && vars.ENABLE_GCP_DEPLOY == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker gcr.io --quiet

      - name: Build and push model-pipeline image
        working-directory: model-pipeline
        run: |
          docker build -t gcr.io/wildfire-mlops-123/model-pipeline:${{ github.sha }} .
          docker push gcr.io/wildfire-mlops-123/model-pipeline:${{ github.sha }}

  # ── Stages 4–7: Train → Validate → Bias Gate → Registry Push ────────────
  # Runs only on merge to main (not on PRs)
  train-validate-register:
    name: "Stage 4-7 — Train, Validate, Bias Gate, Registry"
    runs-on: ubuntu-latest
    needs: container-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && vars.ENABLE_GCP_DEPLOY == 'true'
    environment: model-training

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        working-directory: model-pipeline
        run: pip install -r requirements.txt

      - name: Stage 4 — Train both models + validate + bias gate
        working-directory: model-pipeline
        env:
          GCS_BUCKET_NAME: ${{ env.GCS_BUCKET }}
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
        run: |
          python -m scripts.train \
            --mode retrain \
            --regions california texas \
            --bucket ${{ env.GCS_BUCKET }} \
            --output-report reports/training_result.json

      - name: Stage 5 — Check AUC-PR gate (region-specific thresholds)
        working-directory: model-pipeline
        run: |
          python -c "
          import json, sys
          # Thresholds must match model_config.yaml validation section
          THRESHOLDS = {
              'california': 0.89,
              'texas': 0.78,
          }
          DEFAULT_THRESHOLD = 0.89
          with open('reports/training_result.json') as f:
              report = json.load(f)
          failed = []
          for region, result in report['regions'].items():
              auc_pr = result['metrics'].get('auc_pr', 0)
              threshold = THRESHOLDS.get(region.lower(), DEFAULT_THRESHOLD)
              print(f'[{region}] AUC-PR: {auc_pr:.4f} (gate: {threshold})')
              if auc_pr < threshold:
                  failed.append(region)
          if failed:
              print(f'FAILED regions: {failed}')
              sys.exit(1)
          print('PASSED: all regions met their AUC-PR threshold')
          "

      - name: Stage 6 — Check bias gate (all regions)
        working-directory: model-pipeline
        run: |
          python -c "
          import json, sys
          with open('reports/training_result.json') as f:
              report = json.load(f)
          failed = []
          for region, result in report['regions'].items():
              if not result.get('bias_gate_passed', False):
                  failed.append(region)
          if failed:
              print(f'FAILED bias gate: {failed}')
              sys.exit(1)
          print('PASSED: bias gate OK for all regions')
          "

      - name: Stage 7 — Verify Vertex AI registry push (all regions)
        working-directory: model-pipeline
        run: |
          python -c "
          import json, sys
          with open('reports/training_result.json') as f:
              report = json.load(f)
          failed = []
          for region, result in report['regions'].items():
              if not result.get('registry_version'):
                  failed.append(region)
          if failed:
              print(f'FAILED: models not registered for {failed}')
              sys.exit(1)
          print('PASSED: all regions registered in Vertex AI')
          "

      - name: Upload training report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: training-report-${{ github.sha }}
          path: model-pipeline/reports/

  # ── Stage 8: Deploy (manual approval required) ───────────────────────────
  deploy:
    name: "Stage 8 — Deploy (Manual Approval)"
    runs-on: ubuntu-latest
    needs: train-validate-register
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && vars.ENABLE_GCP_DEPLOY == 'true'
    environment: production   # Requires reviewer approval in GitHub settings

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy inference service to Cloud Run
        run: |
          gcloud run deploy wildfire-inference \
            --image gcr.io/wildfire-mlops-123/model-pipeline:${{ github.sha }} \
            --region ${{ env.GCP_REGION }} \
            --set-env-vars GCS_BUCKET_NAME=${{ env.GCS_BUCKET }} \
            --set-env-vars MLFLOW_TRACKING_URI=${{ secrets.MLFLOW_TRACKING_URI }} \
            --no-allow-unauthenticated \
            --quiet

      - name: Smoke test — verify /health endpoint
        run: |
          CLOUD_RUN_URL=$(gcloud run services describe wildfire-inference \
            --region ${{ env.GCP_REGION }} --format "value(status.url)")
          echo "Smoke testing: ${CLOUD_RUN_URL}/health"
          TOKEN=$(gcloud auth print-identity-token)
          for i in 1 2 3; do
            HTTP_STATUS=$(curl -sf -o /dev/null -w "%{http_code}" \
              -H "Authorization: Bearer ${TOKEN}" \
              --max-time 10 "${CLOUD_RUN_URL}/health") && break || sleep 10
          done
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "Smoke test FAILED — /health returned HTTP ${HTTP_STATUS}"
            exit 1
          fi
          echo "Smoke test PASSED — service is healthy"

      - name: Notify Slack on success
        if: success()
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data '{"text":"wildfire-ignition deployed to production (SHA: ${{ github.sha }})"}' \
            ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Notify Slack on failure
        if: failure()
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data '{"text":"wildfire-ignition deploy FAILED (SHA: ${{ github.sha }})"}' \
            ${{ secrets.SLACK_WEBHOOK_URL }}

  # ── Stage 9: Monitoring Scheduler ────────────────────────────────────────────
  monitoring-scheduler:
    name: "Stage 9 — Monitoring Scheduler"
    runs-on: ubuntu-latest
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && vars.ENABLE_GCP_DEPLOY == 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Create or update Cloud Scheduler job (every 6 hours)
        run: |
          CLOUD_RUN_URL=$(gcloud run services describe wildfire-inference \
            --region ${{ env.GCP_REGION }} --format "value(status.url)")
          gcloud scheduler jobs describe wildfire-monitor \
            --location ${{ env.GCP_REGION }} > /dev/null 2>&1 \
          && gcloud scheduler jobs update http wildfire-monitor \
            --location ${{ env.GCP_REGION }} \
            --schedule "0 */6 * * *" \
            --uri "${CLOUD_RUN_URL}/monitor" \
            --message-body '{"baseline_run_id":"latest"}' \
            --headers "Content-Type=application/json" \
            --oidc-service-account-email ${{ secrets.GCP_SA_EMAIL }} \
          || gcloud scheduler jobs create http wildfire-monitor \
            --location ${{ env.GCP_REGION }} \
            --schedule "0 */6 * * *" \
            --uri "${CLOUD_RUN_URL}/monitor" \
            --message-body '{"baseline_run_id":"latest"}' \
            --headers "Content-Type=application/json" \
            --oidc-service-account-email ${{ secrets.GCP_SA_EMAIL }}
          echo "Cloud Scheduler job wildfire-monitor configured."
