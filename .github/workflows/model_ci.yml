name: Model Pipeline CI/CD

on:
  push:
    branches: [main, master]
    paths: ["model-pipeline/**"]
  pull_request:
    branches: [main, master]
    paths: ["model-pipeline/**"]

env:
  PYTHON_VERSION: "3.11"

  # Eliminates the deprecation warning on actions/checkout and actions/setup-python.
  # Safe to remove this line after June 2 once Node 24 becomes the runner default.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  lint:
    name: "Stage 1 — Lint & Type Check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "${{ env.PYTHON_VERSION }}"
      - name: Install linters
        working-directory: model-pipeline
        run: pip install ruff mypy
      - name: Ruff lint
        working-directory: model-pipeline
        run: ruff check src/ tests/
      - name: Mypy type check
        working-directory: model-pipeline
        run: mypy src/ --ignore-missing-imports --no-strict-optional

  test:
    name: "Stage 2 — Unit Tests (>= 90% coverage)"
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "${{ env.PYTHON_VERSION }}"
      - name: Install dependencies
        working-directory: model-pipeline
        run: pip install -r requirements.txt
      - name: Run unit tests with coverage
        working-directory: model-pipeline
        run: pytest tests/ -v --cov=src --cov-report=xml --cov-fail-under=90

  build:
    name: "Stage 3 — Container Build"
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build multi-platform image
        # Dockerfile must live at model-pipeline/Dockerfile.
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -t wildfire-model:${{ github.sha }} \
            ./model-pipeline

  integration:
    name: "Stage 4 — Integration Test"
    runs-on: ubuntu-latest
    needs: build
    # NOTE: `build` is skipped on PRs (push-only). GitHub treats a skipped
    # dependency as satisfied, so this job still runs on PRs — but against
    # no built image. Acceptable while Stage 4 is a no-op. Revisit when
    # OBJ-1 is implemented and real integration tests are added.
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "${{ env.PYTHON_VERSION }}"
      - name: Install dependencies
        working-directory: model-pipeline
        run: pip install -r requirements.txt
      # NOTE: `|| echo` escape hatch is intentional scaffolding.
      # Remove once OBJ-1 is implemented so real failures are not swallowed.
      - name: Run integration tests
        working-directory: model-pipeline
        run: pytest tests/ -v -k integration || echo "Integration tests pending model implementation"

  validate:
    name: "Stage 5 — Model Validation (AUC-PR > 0.75)"
    runs-on: ubuntu-latest
    needs: integration
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "${{ env.PYTHON_VERSION }}"
      - name: Install dependencies
        working-directory: model-pipeline
        run: pip install -r requirements.txt
      - name: Validate model metrics
        working-directory: model-pipeline
        run: echo "Pending OBJ-1 implementation"

  bias_gate:
    name: "Stage 6 — Bias Gate (BLOCKING)"
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "${{ env.PYTHON_VERSION }}"
      - name: Install dependencies
        working-directory: model-pipeline
        run: pip install -r requirements.txt
      - name: Run bias gate checks
        working-directory: model-pipeline
        run: echo "Pending OBJ-1 predictions + FEMA NRI data"

  push_artifact:
    name: "Stage 7 — Artifact Push"
    runs-on: ubuntu-latest
    needs: bias_gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Push artifact
        run: echo "Pending Stages 5+6 pass"

  vertex_sync:
    name: "Stage 8 — Vertex AI Sync (non-blocking)"
    runs-on: ubuntu-latest
    needs: push_artifact
    # Guarded: only runs if push_artifact actually executed (not skipped on PRs).
    # `always()` alone would trigger this on PRs, burning runner minutes
    # and risking credential errors against a non-existent artifact.
    if: always() && needs.push_artifact.result != 'skipped'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Sync to Vertex AI
        run: echo "Non-blocking sync"

  deploy:
    name: "Stage 9 — Deploy"
    runs-on: ubuntu-latest
    needs: push_artifact
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Deploy
        run: echo "Pending infrastructure provisioning"

  notify_failure:
    name: "Notify on Failure"
    runs-on: ubuntu-latest
    needs: [lint, test, build, integration, validate, bias_gate]
    if: failure()
    steps:
      # No checkout needed — curl has no dependency on repo contents.
      # No working-directory — fresh runner always has a valid default.
      - name: Slack failure notification
        run: |
          curl -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{"text":":x: *Model Pipeline FAILED* — ${{ github.ref }} @ ${{ github.sha }}"}' \
            || true