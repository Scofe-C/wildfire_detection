server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy /api requests to the backend Cloud Run service
    location /api/ {
        proxy_pass https://wildfire-inference-987262292513.us-central1.run.app;
        proxy_set_header Host wildfire-inference-987262292513.us-central1.run.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
        proxy_ssl_server_name on;
    }

    # SPA fallback — all other routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
